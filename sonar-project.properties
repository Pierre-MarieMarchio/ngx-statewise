# What SonarCloud analyses, and with which coverage. Read by
# SonarSource/sonarqube-scan-action in .github/workflows/ci.yml.
#
# This file is what moves the project off SonarCloud's Automatic Analysis. That
# mode reads the repository on its own and can be handed nothing the build
# produced — so the library's coverage, measured to the line by every run of
# `npm run check`, was invisible to the quality gate, which judged the one thing
# it could see and called that quality. The two modes are exclusive: Automatic
# Analysis has to be off in the project's settings or the scan below is refused.

sonar.projectKey=Pierre-MarieMarchio_ngx-statewise
sonar.organization=pierre-mariemarchio
sonar.sourceEncoding=UTF-8

# The three projects and the two toolchains. What is left out under tools/ is
# the throwaway applications the measurement scripts build around: nobody
# maintains them, and an issue raised there is an issue nobody will fix.
sonar.sources=projects,scripts,tools
sonar.exclusions=**/dist/**,**/node_modules/**,tools/*/fixture/**,tools/*/consumer/**,**/*.spec.ts

# Declaring the specs as tests rather than sources is what stops duplicated test
# setup from counting against the duplication ceiling. Four components sharing a
# markup block is debt; four specs arranging the same fixture is a suite reading
# the way a suite should.
sonar.tests=projects
sonar.test.inclusions=**/*.spec.ts

# Written by `npm run test:coverage`, which `npm run check` runs before the scan.
sonar.javascript.lcov.reportPaths=coverage/ngx-statewise/lcov.info

# Only the library is measured. Its own threshold is 100% statements, lines and
# functions and it fails its build below that, so the gate here confirms rather
# than discovers. The showcase and the docs site have suites but report no lcov,
# and letting them in would post 0% against code that is covered — a number that
# says the opposite of the truth is worse than no number.
sonar.coverage.exclusions=projects/ngx-statewise-showcase/**,projects/ngx-statewise-docs/**,scripts/**,tools/**

# --- rules answered in the code rather than followed -------------------------
# Five rules disagree with a choice this repository made on purpose, and every
# one of them would be a regression to "fix". They are declared here, next to
# the reason, rather than left to be re-triaged in the SonarCloud UI on every
# branch.
sonar.issue.ignore.multicriteria=listRole,groupRole,scrollTabindex,delegatedClick,trustedMarkdown

# `role="list"` on a `<ul>` is redundant per the HTML spec, and Safari drops
# list semantics entirely from a list whose `list-style` is `none` — which is
# every list named here. The redundant role is what keeps VoiceOver announcing
# "list, 5 items".
sonar.issue.ignore.multicriteria.listRole.ruleKey=Web:S6822
sonar.issue.ignore.multicriteria.listRole.resourceKey=**/*.html

# `role="group"` with `aria-labelledby` groups the theme buttons, the language
# links and the comparison table's scroll container. The rule offers
# `<fieldset>`, `<optgroup>`, `<address>` and `<details>` instead: none of the
# three is a form field, an option list, contact details or a disclosure.
sonar.issue.ignore.multicriteria.groupRole.ruleKey=Web:S6819
sonar.issue.ignore.multicriteria.groupRole.resourceKey=**/*.html

# `tabindex="0"` on a scroll container and on a keyboard-movable kanban card is
# exactly what WCAG 2.1.1 asks for: a region no keyboard can reach fails it.
# The rule reads the element as non-interactive; the keydown handlers on it and
# the overflow it owns are what make it one.
sonar.issue.ignore.multicriteria.scrollTabindex.ruleKey=Web:S6845
sonar.issue.ignore.multicriteria.scrollTabindex.resourceKey=**/*.html

# The guide's `<article>` carries one delegated click listener for the links and
# the copy buttons inside the rendered markdown. Both are natively activated by
# the keyboard, and both raise the same `click` when they are — so a keyboard
# equivalent already exists and a second handler would double every activation.
sonar.issue.ignore.multicriteria.delegatedClick.ruleKey=Web:MouseEventWithoutKeyboardEquivalentCheck
sonar.issue.ignore.multicriteria.delegatedClick.resourceKey=**/pages/guide/guide-page.component.html

# `bypassSecurityTrustHtml` on the rendered guide. The markdown is repository
# content compiled into the bundle, never user input, and Angular's sanitizer
# strips the `id`, `role`, `aria-*` and `data-*` attributes the heading anchors,
# the table of contents, the scrollable regions and the copy buttons are made
# of. The call site states the same thing above it.
sonar.issue.ignore.multicriteria.trustedMarkdown.ruleKey=typescript:S6268
sonar.issue.ignore.multicriteria.trustedMarkdown.resourceKey=**/pages/guide/guide-page.component.ts
