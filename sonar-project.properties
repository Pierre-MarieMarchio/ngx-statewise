# What SonarCloud analyses, and with which coverage. Read by
# SonarSource/sonarqube-scan-action in .github/workflows/ci.yml.
#
# This file is what moves the project off SonarCloud's Automatic Analysis. That
# mode reads the repository on its own and can be handed nothing the build
# produced — so the library's coverage, measured to the line by every run of
# `npm run check`, was invisible to the quality gate, which judged the one thing
# it could see and called that quality. The two modes are exclusive: Automatic
# Analysis has to be off in the project's settings or the scan below is refused.

sonar.projectKey=Pierre-MarieMarchio_ngx-statewise
sonar.organization=pierre-mariemarchio
sonar.sourceEncoding=UTF-8

# The three projects and the two toolchains. What is left out under tools/ is
# the throwaway applications the measurement scripts build around: nobody
# maintains them, and an issue raised there is an issue nobody will fix.
sonar.sources=projects,scripts,tools
sonar.exclusions=**/dist/**,**/node_modules/**,tools/*/fixture/**,tools/*/consumer/**,**/*.spec.ts

# Declaring the specs as tests rather than sources is what stops duplicated test
# setup from counting against the duplication ceiling. Four components sharing a
# markup block is debt; four specs arranging the same fixture is a suite reading
# the way a suite should.
sonar.tests=projects
sonar.test.inclusions=**/*.spec.ts

# Written by `npm run test:coverage`, which `npm run check` runs before the scan.
sonar.javascript.lcov.reportPaths=coverage/ngx-statewise/lcov.info

# Only the library is measured. Its own threshold is 100% statements, lines and
# functions and it fails its build below that, so the gate here confirms rather
# than discovers. The showcase and the docs site have suites but report no lcov,
# and letting them in would post 0% against code that is covered — a number that
# says the opposite of the truth is worse than no number.
sonar.coverage.exclusions=projects/ngx-statewise-showcase/**,projects/ngx-statewise-docs/**,scripts/**,tools/**
