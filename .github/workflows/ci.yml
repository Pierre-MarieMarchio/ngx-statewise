name: CI

# The gate a change is expected to pass, run where it can still be fixed:
# on the pull request, and again on dev once it lands.
on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Validate workspace
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting, lint, tests, coverage and builds
        run: npm run check
