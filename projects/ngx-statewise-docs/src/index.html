<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <title>ngx-statewise</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Documentation for ngx-statewise, a lightweight signals-first state management library for Angular."
    />
    <link rel="icon" href="icon-logo.png" type="image/png" />
    <meta
      name="theme-color"
      content="#131218"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="theme-color"
      content="#fbfafc"
      media="(prefers-color-scheme: light)"
    />

    <!--
      The two faces that render before the reader has scrolled anything: the
      serif sets the prose, the sans sets the header, the sidebar and every
      heading. Both are found by the stylesheet a moment later, which is a
      round trip too late on a cold load.

      The hrefs are relative, so the `base` above resolves them under the
      /ngx-statewise/ base href the production build sets. They are also
      stable, which is why the docs build hashes bundles but not media: a
      preload cannot name a file whose hash it does not know.
    -->
    <link
      rel="preload"
      href="media/newsreader-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="media/space-grotesk-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      // Resolves the theme before the first paint. Without it, every load
      // would show the default until Angular booted and corrected it.
      // The key and the class names mirror src/app/ui-state/theme.ts.
      (function () {
        var choice = null;
        try {
          choice = localStorage.getItem('ngx-statewise-docs-theme');
        } catch (error) {
          // Storage blocked: fall through to the system preference.
        }
        if (choice !== 'light' && choice !== 'dark') {
          choice = 'system';
        }
        var theme = choice;
        if (choice === 'system') {
          theme =
            typeof matchMedia === 'function' &&
            matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
        }
        document.documentElement.classList.remove('dark', 'light');
        document.documentElement.classList.add(theme);
      })();
    </script>
  </head>
  <body>
    <docs-root></docs-root>
  </body>
</html>
