<div class="project-task-list-container">
  @if (!projectManager.projects().length) {
    <p class="empty-state">No project to group the tasks by.</p>
  } @else {
    <mat-accordion displayMode="flat" multi>
      @for (group of groups(); track group.project.id) {
        <mat-expansion-panel
          togglePosition="before"
          class="project-task-list-expansion-panel"
        >
          <mat-expansion-panel-header>
            <mat-panel-title [class]="'tag-' + group.project.color">
              {{ group.project.title }}</mat-panel-title
            >
          </mat-expansion-panel-header>

          <app-task-table
            [tasks]="group.tasks"
            [capped]="true"
            emptyMessage="No task in this project."
            (taskSelected)="taskSelected.emit($event)"
          />
        </mat-expansion-panel>
      }
    </mat-accordion>
  }
</div>
