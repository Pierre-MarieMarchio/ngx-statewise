<app-section-card heading="TASK KANBAN">
  @if (isEmpty()) {
    <p class="empty-state">No task to show.</p>
  } @else {
    <app-kanban
      [columns]="columns()"
      [cardTypeFor]="cardTypeFor"
      [labelFor]="labelFor"
      (itemMoved)="onTaskMoved($event)"
    >
      <ng-template #kanbanCard let-task>
        <app-task-card-body [task]="task" />
      </ng-template>
    </app-kanban>
  }
</app-section-card>
