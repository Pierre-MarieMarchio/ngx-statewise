<div class="kanban-task-container">
  <!--
    The tab label names this board on screen, so the heading is only read.
    Without it the page went from the h1 of /task straight to the h3 of a
    kanban column.
  -->
  <h2 class="visually-hidden">Task kanban</h2>
  @if (!projectManager.projects().length) {
    <p class="empty-state">No project, so no board to draw.</p>
  } @else {
    <mat-accordion class="project-accordion" displayMode="flat" multi>
      @for (board of boards(); track board.project.id) {
        <mat-expansion-panel
          togglePosition="before"
          class="kanban-project-task-expansion-panel"
        >
          <mat-expansion-panel-header>
            <mat-panel-title [class]="'tag-' + board.project.color">
              {{ board.project.title }}</mat-panel-title
            >
          </mat-expansion-panel-header>

          <app-kanban
            [columns]="board.columns"
            [group]="board.project.id"
            [cardTypeFor]="cardTypeFor"
            [labelFor]="labelFor"
            [reorderable]="true"
            (itemMoved)="onTaskMoved($event)"
            (columnReordered)="onColumnReordered($event)"
          >
            <ng-template #kanbanCard let-task>
              <app-task-card-body [task]="task" />
            </ng-template>
          </app-kanban>
        </mat-expansion-panel>
      }
    </mat-accordion>
  }
</div>
