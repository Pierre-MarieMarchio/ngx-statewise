<mat-card class="overview-task-list-container">
  <div><h2 class="overview-task-list-title">ALL TASK</h2></div>

  @if (!tasks()?.length) {
    <p class="empty-state">No task to show.</p>
  } @else {
    <div class="overview-task-list-scroll">
      <table mat-table [dataSource]="tasks() ?? []">
        @for (column of columns(); track column) {
          <ng-container [matColumnDef]="column.columnDef">
            <th mat-header-cell *matHeaderCellDef>
              {{ column.header }}
            </th>
            <td mat-cell *matCellDef="let row">
              {{ column.cell(row) }}
            </td>
          </ng-container>
        }

        <tr mat-header-row *matHeaderRowDef="displayedColumns()"></tr>
        <tr
          mat-row
          class="clickable-row"
          (click)="selectTask(item)"
          *matRowDef="let item; columns: displayedColumns()"
        ></tr>
      </table>
    </div>
  }
</mat-card>
