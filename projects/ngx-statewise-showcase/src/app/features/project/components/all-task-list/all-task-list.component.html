<div class="all-task-list-container">
  @if (!tasks().length) {
    <p class="empty-state">No task to show.</p>
  } @else {
    <table mat-table [dataSource]="tasks()">
      @for (column of columns(); track column) {
        <ng-container [matColumnDef]="column.columnDef">
          <th mat-header-cell *matHeaderCellDef>
            {{ column.header }}
          </th>
          <td mat-cell *matCellDef="let row">
            {{ column.cell(row) }}
          </td>
        </ng-container>
      }

      <ng-container matColumnDef="open">
        <th mat-header-cell *matHeaderCellDef class="open-cell">
          <span class="visually-hidden">Open</span>
        </th>
        <td mat-cell *matCellDef="let row" class="open-cell">
          <!-- The row click is a mouse shortcut; this button is the path a
               keyboard has, and the only one that announces itself. -->
          <button
            mat-icon-button
            type="button"
            [attr.aria-label]="'Open ' + row.title"
            (click)="$event.stopPropagation(); selectTask(row)"
          >
            <mat-icon>chevron_right</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns()"></tr>
      <tr
        mat-row
        class="clickable-row"
        (click)="selectTask(item)"
        *matRowDef="let item; columns: displayedColumns()"
      ></tr>
    </table>
  }
</div>
