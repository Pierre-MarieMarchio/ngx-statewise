<mat-form-field
  class="task-search-field"
  subscriptSizing="dynamic"
  appearance="outline"
>
  <mat-label>Search tasks</mat-label>
  <input
    matInput
    type="search"
    [value]="query()"
    (input)="onInput($any($event.target).value)"
  />

  @if (query() !== '') {
    <button
      matSuffix
      mat-icon-button
      type="button"
      aria-label="Clear the search"
      (click)="clear()"
    >
      <mat-icon>close</mat-icon>
    </button>
  }
</mat-form-field>

<!--
  The region exists before it has anything to say: one inserted along with its
  text is announced by no screen reader reliably.
-->
<p class="visually-hidden" role="status">
  {{ searching() ? 'Searching' : '' }}
</p>
