@if (!tasks().length) {
  <p class="empty-state">{{ emptyMessage() }}</p>
} @else {
  <table mat-table [dataSource]="tasks()">
    <!--
      Tracked by the column name rather than by the object: `cappedColumns`
      spreads each definition into a new one, so tracking by identity rebuilt
      every cell of every table whenever the signed-in role changed.
    -->
    @for (column of columns(); track column.columnDef) {
      <ng-container [matColumnDef]="column.columnDef">
        <th mat-header-cell *matHeaderCellDef [style.width]="column.maxWidth">
          {{ column.header }}
        </th>
        <td mat-cell *matCellDef="let row" [style.width]="column.maxWidth">
          {{ column.cell(row) }}
        </td>
      </ng-container>
    }

    <app-task-open-column (opened)="taskSelected.emit($event)" />

    <tr mat-header-row *matHeaderRowDef="displayedColumns()"></tr>
    <!--
      Opening a task is the button in `app-task-open-column` and nothing else.
      The row itself used to carry a `(click)` as a mouse shortcut; a `<tr>` is
      not focusable, so that shortcut had no keyboard equivalent it could ever
      grow, and one interactive path is worth more than two unequal ones.
    -->
    <tr mat-row *matRowDef="let item; columns: displayedColumns()"></tr>
  </table>
}
