<div class="docs-page-container">
  <h1 class="docs-page-header">DOCS</h1>
  <p class="docs-page-intro">
    What each mechanism of ngx-statewise does, and where this showcase exercises
    it.
  </p>

  <mat-accordion class="docs-accordion" displayMode="flat" multi>
    @for (section of sections; track section.id) {
      <mat-expansion-panel
        class="docs-panel"
        togglePosition="before"
        [attr.data-section]="section.id"
      >
        <mat-expansion-panel-header>
          <mat-panel-title class="docs-panel-title">
            {{ section.title }}
          </mat-panel-title>
        </mat-expansion-panel-header>

        <p class="docs-summary">{{ section.summary }}</p>
        <pre class="docs-snippet"><code>{{ section.snippet }}</code></pre>

        @if (section.id === 'precedence') {
          <app-notice-demo />
        }
        <p class="docs-seen-in">
          <mat-icon class="docs-seen-in-icon icon-outlined">code</mat-icon>
          <span>{{ section.seenIn }}</span>
        </p>
      </mat-expansion-panel>
    }
  </mat-accordion>
</div>
