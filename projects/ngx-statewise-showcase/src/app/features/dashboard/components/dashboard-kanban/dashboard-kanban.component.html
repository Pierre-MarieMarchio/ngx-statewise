<mat-card class="dashboard-kanban-task-container">
  <div><h2 class="dashboard-kanban-task-title">TASK KANBAN</h2></div>

  @if (isEmpty()) {
    <p class="empty-state">No task to show.</p>
  } @else {
    <app-kanban
      [columns]="columns()"
      [cardTypeFor]="cardTypeFor"
      [labelFor]="labelFor"
      (itemMoved)="onTaskMoved($event)"
    >
      <ng-template #kanbanCard let-task>
        <mat-card-header>
          <mat-card-title>{{ task.title }}</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <p>{{ task.description }}</p>
        </mat-card-content>
      </ng-template>
    </app-kanban>
  }
</mat-card>
