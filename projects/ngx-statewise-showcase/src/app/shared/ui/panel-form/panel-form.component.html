<h2 class="panel-form-title">{{ heading() }}</h2>

<div class="panel-form-fields">
  <ng-content />
</div>

@if (refusal()) {
  <!-- role="alert" so a screen reader is told without having to go looking. -->
  <p class="panel-form-refusal" role="alert">{{ refusal() }}</p>
}

<div class="panel-form-actions">
  <button mat-button type="button" (click)="cancelled.emit()">Cancel</button>
  <button
    class="primary-btn"
    mat-flat-button
    type="submit"
    [disabled]="pending()"
  >
    {{ pending() ? pendingLabel() : submitLabel() }}
  </button>
</div>
