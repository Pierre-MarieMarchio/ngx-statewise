<!--
  One grid for the whole board: the headers fill its first row and the columns
  its second, so a header cannot drift from the column it names. They used to
  be a `mat-grid-list` of N tiles above a flex row of N columns — two layout
  systems for one grid, lined up only because the widths came out equal.
-->
<div class="kanban" [style.gridTemplateColumns]="columnTracks()">
  @for (column of columns(); track column.id) {
    <h3 class="kanban-column-header">{{ column.label }}</h3>
  }

  @for (column of columns(); track column.id) {
    <div
      class="kanban-column"
      cdkDropList
      role="list"
      [attr.aria-label]="column.label + ' items'"
      [id]="dropListId(column.id)"
      [cdkDropListData]="column"
      [cdkDropListConnectedTo]="dropListIds()"
      (cdkDropListDropped)="onDrop($event)"
    >
      @for (item of column.items; track item.id) {
        <!--
          `cdkDrag` is on the host, not on the `<mat-card>` inside it. The host
          is what the drop list holds and what carries the card's identity —
          its role, its label, its `data-card-id` — so it has to be what moves.
          On the inner card the CDK left the host in the flow and put its
          placeholder inside it, which is half of why one task appeared twice.
        -->
        <app-kanban-card
          cdkDrag
          [cdkDragData]="item"
          [cardType]="cardTypeFor()(item)"
          role="listitem"
          tabindex="0"
          [attr.data-card-id]="item.id"
          [attr.aria-label]="labelFor()(item)"
          (keydown.arrowleft)="moveByKeyboard(item, column, -1)"
          (keydown.arrowright)="moveByKeyboard(item, column, 1)"
          (keydown.arrowup)="reorderByKeyboard(item, column, -1)"
          (keydown.arrowdown)="reorderByKeyboard(item, column, 1)"
        >
          <ng-container
            [ngTemplateOutlet]="cardBody()"
            [ngTemplateOutletContext]="{ $implicit: item }"
          />
        </app-kanban-card>
      }
    </div>
  }
</div>

<!--
  Where a keyboard move is read out. It is in the template rather than raised
  on the spot, so the region exists before its text changes — a live region
  inserted along with its content is announced by no screen reader reliably.
-->
<p class="visually-hidden" role="status">{{ announcement() }}</p>
