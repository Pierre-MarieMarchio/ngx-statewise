<mat-sidenav-container class="side-panel-container">
  <mat-sidenav
    #sidenav
    fixedInViewport="fixed"
    position="end"
    mode="over"
    class="side-panel-content"
  >
    <ng-content select="[slot=panel-content]" />
  </mat-sidenav>
  <!--
    `select` belongs on the `<ng-content>`, not on the element around it: on
    `<mat-sidenav-content>` it matched no input and the marker chose nothing.
  -->
  <mat-sidenav-content class="view-content">
    <ng-content select="[slot=view-content]" />
  </mat-sidenav-content>
</mat-sidenav-container>
