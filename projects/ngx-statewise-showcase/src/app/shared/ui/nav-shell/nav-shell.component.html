<div class="side-nav-container">
  <div class="side-nav-content">
    <mat-nav-list>
      <!-- The name goes on the link; the image is decorative beside it. -->
      <a
        class="side-nav-logo"
        mat-item
        [routerLink]="''"
        aria-label="Ngx-Statewise, back to home"
      >
        <img class="side-nav-logo-img" src="icon-logo.png" alt="" />
      </a>
      @if (isLoggedIn()) {
        @for (item of navigationItems(); track item.label) {
          @if (item.href) {
            <!-- Leaves the application, so a plain link and a new tab. -->
            <a
              mat-item
              class="nav-groupe-icon color-secondary"
              [href]="item.href"
              target="_blank"
              rel="noopener"
            >
              <mat-icon class="nav-icon icon-outlined" matListItemIcon>
                {{ item.icon }}
              </mat-icon>
              <span>{{ item.label }}</span>
            </a>
          } @else {
            <a
              mat-item
              class="nav-groupe-icon color-secondary"
              [routerLink]="item.route"
              routerLinkActive="active-link"
            >
              <mat-icon class="nav-icon icon-outlined" matListItemIcon>
                {{ item.icon }}
              </mat-icon>
              <span>{{ item.label }}</span>
            </a>
          }
        }
      }
    </mat-nav-list>
  </div>
  <div class="footer-toggles">
    @if (isLoggedIn()) {
      <div class="footer-groupe-button color-secondary">
        <button
          (click)="logout.emit()"
          disableRipple="true"
          class=".no-hover-button"
          mat-icon-button
          aria-label="Log out"
        >
          <mat-icon class="footer-icon color-secondary icon-outlined">
            logout
          </mat-icon>
        </button>
        <span>logout</span>
      </div>
    }
    <app-theme-toggle />
  </div>
</div>
