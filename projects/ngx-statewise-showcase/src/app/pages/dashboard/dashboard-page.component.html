<app-side-panel [(opened)]="panelOpen">
  <div slot="view-content">
    <div class="dashboard-page-header-container">
      <h1 class="dashboard-page-header">Dashboard</h1>
    </div>
    <app-user-picker />

    <app-data-state
      label="tasks"
      [loading]="taskManager.isLoading() || taskManager.isSaving()"
      [error]="taskManager.isError()"
      [retryable]="true"
      (retried)="taskManager.getAll()"
    />

    <!--
      A refused write, in the server's own words. Not retryable: what to do
      about "assign someone before marking it done" is to assign someone, not
      to send the same write again.
    -->
    <app-data-state
      label="save"
      [error]="taskManager.saveError() !== null"
      [errorMessage]="taskManager.saveError() ?? ''"
    />

    <div class="dashboard-container">
      <!--
        The same picker the task page ends with, because it is the same
        question. Choosing here goes on to the board, since choosing a project
        and then staying on a page that shows every project is a choice with
        nothing to show for itself.
      -->
      <app-section-card heading="Projects">
        <app-project-picker
          [tasks]="taskManager.tasks()"
          (chosen)="openBoard()"
        />
      </app-section-card>

      <app-section-card heading="My tasks">
        <app-personal-task-list
          [allTasks]="taskManager.tasks()"
          (taskSelected)="selectTask($event)"
        />
      </app-section-card>
    </div>
  </div>

  <app-task-details
    slot="panel-content"
    [selectedTask]="selectedTask()"
    (closed)="closeSideNav()"
  />
</app-side-panel>
