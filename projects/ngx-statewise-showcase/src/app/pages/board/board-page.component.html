<app-side-panel [(opened)]="panelOpen">
  <div slot="view-content">
    <div class="board-header">
      <h1 class="task-page-header">TASK</h1>
      <div class="board-header-actions">
        <button
          class="primary-btn"
          mat-stroked-button
          type="button"
          (click)="openNewProject()"
        >
          <mat-icon>add</mat-icon>
          New project
        </button>
        <button
          class="primary-btn"
          mat-stroked-button
          type="button"
          [disabled]="!projectManager.projects().length"
          (click)="openNewTask()"
        >
          <mat-icon>add</mat-icon>
          New task
        </button>
      </div>
    </div>

    <app-data-state
      label="tasks"
      [loading]="taskManager.isLoading() || taskManager.isSaving()"
      [error]="taskManager.isError()"
      [retryable]="true"
      (retried)="taskManager.getAll()"
    />
    <app-data-state
      label="projects"
      [loading]="projectManager.isLoading()"
      [error]="projectManager.isError()"
      [retryable]="true"
      (retried)="projectManager.getAll()"
    />
    <!--
      A refused write, in the server's own words. Not retryable: what to do
      about "assign someone before marking it done" is to assign someone, not
      to send the same write again.
    -->
    <app-data-state
      label="save"
      [error]="taskManager.saveError() !== null"
      [errorMessage]="taskManager.saveError() ?? ''"
    />

    <app-task-search
      class="board-search"
      [searching]="taskManager.isSearching()"
      (queried)="taskManager.search($event)"
      (cleared)="taskManager.clearSearch()"
    />

    <mat-tab-group mat-stretch-tabs="false" mat-align-tabs="start">
      <mat-tab>
        <ng-template mat-tab-label>
          <mat-icon class="tab-icon">view_kanban</mat-icon>
          Kanban
        </ng-template>
        <app-task-kanban
          [tasks]="taskManager.visibleTasks()"
          (taskChanged)="onTaskChanged($event)"
      /></mat-tab>
      <mat-tab>
        <ng-template mat-tab-label>
          <mat-icon class="tab-icon">view_list</mat-icon>
          All Tasks
        </ng-template>
        <div class="tab-body">
          <app-task-table
            [tasks]="taskManager.visibleTasks()"
            (taskSelected)="selectTask($event)"
          />
        </div>
      </mat-tab>
      <mat-tab>
        <ng-template mat-tab-label>
          <mat-icon class="tab-icon">person</mat-icon>
          My Tasks
        </ng-template>
        <app-personal-task-list
          (taskSelected)="selectTask($event)"
          [allTasks]="taskManager.visibleTasks()"
        />
      </mat-tab>
      <mat-tab>
        <ng-template mat-tab-label>
          <mat-icon class="tab-icon">construction</mat-icon>
          Projects
        </ng-template>
        <app-project-task-list
          (taskSelected)="selectTask($event)"
          [tasks]="taskManager.visibleTasks()"
        />
      </mat-tab>
    </mat-tab-group>
  </div>

  <div slot="panel-content">
    @switch (panel()) {
      @case ('new-project') {
        <app-project-form
          [pending]="projectManager.isCreating()"
          [refusal]="projectManager.createError()"
          (submitted)="createProject($event)"
          (cancelled)="closeSideNav()"
        />
      }
      @case ('new-task') {
        <app-task-form
          [projects]="projectManager.projects()"
          [pending]="taskManager.isCreating()"
          [refusal]="taskManager.createError()"
          (submitted)="createTask($event)"
          (cancelled)="closeSideNav()"
        />
      }
      @case ('edit-task') {
        <app-task-form
          [task]="selectedTask()"
          [projects]="projectManager.projects()"
          [pending]="taskManager.isSaving()"
          (submitted)="saveTask($event)"
          (cancelled)="panel.set('task')"
        />
      }
      @default {
        <app-task-details
          [selectedTask]="selectedTask()"
          [editable]="true"
          (editRequested)="editTask()"
          (closed)="closeSideNav()"
        />
      }
    }
  </div>
</app-side-panel>
